input create_budget_categories_input {
  id: ID

  """Maximum amount allocated for this category before contingency."""
  ceiling_amount: Float

  """
  Percentage buffer on top of ceiling_amount. Defaults to the global contingency set in wedding_settings.
  """
  contingency_percent: Int

  """
  Total value of vendor contracts and bookings assigned to this category.
  """
  amount_allocated: Float

  """Sum of deposits and payments made to vendors in this category."""
  amount_paid: Float

  """
  Set to true when amount_allocated exceeds ceiling_amount × (1 + contingency_percent / 100). Intended to be updated by a Flow.
  """
  is_over_budget: Boolean

  """Internal notes only — not visible to vendors or guests."""
  notes: String

  """The budget category name. Must be unique."""
  name: String
  color: String
}

input create_budget_items_input {
  id: ID
  sort: Int
  user_created: create_directus_users_input
  date_created: Date
  user_updated: create_directus_users_input
  date_updated: Date
  category: create_budget_categories_input

  """
  What this expense is for. Be specific enough that you remember what it was six months later.
  """
  label: String
  description: String

  """
  Expected cost before you have an actual figure. Used for planning before quotes come in.
  """
  estimated_amount: Float

  """
  Real cost once confirmed. Replaces estimated_amount in budget rollup calculations once set.
  """
  actual_amount: Float

  """
  Any additional context. Especially useful for cash purchases or split payments.
  """
  notes: String
  payments: [create_payments_input]
}

input create_contracts_input {
  id: ID
  user_created: create_directus_users_input
  date_created: Date
  user_updated: create_directus_users_input
  date_updated: Date

  """
  Short description of what this contract covers. Useful when a vendor has multiple contracts for different services.
  """
  title: String
  status: String

  """
  Total agreed contract value. This is the ceiling against which payments are tracked. Update if the contract is amended.
  """
  total_value: Float

  """Date the contract was signed by both parties."""
  date_signed: Date
  contract_file: create_directus_files_input

  """
  Remaining balance. Auto-calculated by a Flow as total_value minus the sum of confirmed payments. Do not edit manually.
  """
  balance_due: Float

  """
  Summary of important contract terms. Not a replacement for reading the actual contract.
  """
  notes: String
  vendor: create_vendors_input
  payments: [create_payments_input]
}

